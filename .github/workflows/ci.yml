name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# 同一 ref 上的 superseded runs 自动取消（节省 CI 分钟）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # 单步复用聚合命令 —— 往 check 里加门，CI 自动跟着跑（避免两处漂移）
      - name: Full check (lint + typecheck + test + smoke)
        run: npm run check
      # 死代码 / 未使用导出检测：本机 Windows 上 oxc-parser 有 ArrayBuffer 分配问题，
      # 故只在 Linux CI 跑，不并入 npm run check。
      - name: Dead code scan (knip)
        run: npm run knip

  # peer 范围 floor 验证：用 package.json 里声明的**最低**版本（当前 0.86.0）跑两条线：
  #   1) smoke —— 加载 + 注册（与 pi 的具体版本无关）
  #   2) 真宿主注入测试 + 注入诊断 —— 验证 floor 版本真的支持 sections / toolGuidelines
  # 版本从 package.json 读，避免与 peerDependencies 两处漂移。
  # 取证：0.85 的 BuildSystemPromptOptions 无这两个字段，0.86 起才有（且导出 ExtensionRunner /
  # discoverAndLoadExtensions，构造函数签名一致）——所以下界必须是 0.86。
  compat-floor-pi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Resolve peer floor
        id: floor
        run: |
          v=$(node -p "require('./package.json').peerDependencies['@earendil-works/pi-coding-agent'].replace(/[^0-9.].*$/, '')")
          echo "pi=$v" >> "$GITHUB_OUTPUT"
          echo "floor pi = $v"
      - name: Install floor Pi
        run: npm install --no-save @earendil-works/pi-coding-agent@${{ steps.floor.outputs.pi }} @earendil-works/pi-tui@${{ steps.floor.outputs.pi }} typebox@1.3.0
      - name: Smoke against floor Pi
        run: node scripts/smoke-load.mjs
      - name: Injection path against floor Pi
        run: npx vitest run --no-file-parallelism test/host-injection.test.ts

  # 向前 canary：装 Pi latest，看有没有 API 破坏
  compat-latest-pi:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install current Pi
        run: npm install --no-save @earendil-works/pi-coding-agent@latest @earendil-works/pi-tui@latest typebox@latest
      - name: Smoke against current Pi
        run: node scripts/smoke-load.mjs