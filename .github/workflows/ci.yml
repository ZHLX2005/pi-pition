name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# 同一 ref 上的 superseded runs 自动取消（节省 CI 分钟）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # 单步复用聚合命令 —— 往 check 里加门，CI 自动跟着跑（避免两处漂移）
      - name: Full check (lint + typecheck + test + smoke)
        run: npm run check

  # peer 范围 floor 验证：用 pi 仓库声称的最低版本试加载
  compat-floor-pi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install floor Pi
        run: npm install --no-save @earendil-works/pi-coding-agent@0.80.5 @earendil-works/pi-tui@0.80.5 typebox@1.3.0
      - name: Smoke against floor Pi
        run: node scripts/smoke-load.mjs

  # 向前 canary：装 Pi latest，看有没有 API 破坏
  compat-latest-pi:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install current Pi
        run: npm install --no-save @earendil-works/pi-coding-agent@latest @earendil-works/pi-tui@latest typebox@latest
      - name: Smoke against current Pi
        run: node scripts/smoke-load.mjs