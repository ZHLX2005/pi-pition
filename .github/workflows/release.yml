name: Release

# Tag-driven release. 流程：
#   1. 在 master 上 bump package.json version + 写 CHANGELOG，commit
#   2. git tag v0.x.y && git push origin v0.x.y
# tag 必须与 package.json 的 version 完全一致，否则 publish 步骤快速失败

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # 创建 GitHub Release
  id-token: write   # npm provenance (OIDC)

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full check before publishing
        run: npm run check

  publish-npm:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund

      # tag 与 package.json version 严格匹配
      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (=$TAG_VERSION) does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # 在这里 npm token 通过 NPM_TOKEN secret 注入；
      # secret 在 repo Settings → Secrets → Actions 里配（值 = npm 自动 token）。
      # NODE_AUTH_TOKEN 在新版 npm 下不被识别，必须写进 ~/.npmrc。
      # 注：--ignore-scripts 会跳过 prepublishOnly，所以校验由上面的 smoke job（npm run check）承担。
      # 这里只做发布本身；两处都跑 check 是重复的。
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm i -g npm@latest
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish --ignore-scripts --provenance --access public

  github-release:
    needs: publish-npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            LICENSE
            README.md